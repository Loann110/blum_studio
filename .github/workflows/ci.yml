name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm run setup
      - run: npm run build
        working-directory: ui
      - run: npm run test:engine
        working-directory: ui
      - run: npm run build:server && npm run build:server-test && npm run test:server
        working-directory: ui
      - run: npm run check
