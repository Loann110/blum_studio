<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Inline opt-in: Chrome samples it when parsing reaches <body>, before theme.css arrives. -->
  <style>@view-transition { navigation: auto; }</style>
  <title>Blum Studio — Settings</title>
  <link rel="icon" href="/assets/brand/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/styles/shell.css" />
  <link rel="stylesheet" href="/css/styles/settings.css" />
  <link rel="stylesheet" href="/render/fonts.css" />
</head>
<body>
  <a class="skip" href="#agents">Skip to the agents</a>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="/"><img src="/assets/brand/logo.svg" alt="" width="34" height="34" /><span>Blum <b>Studio</b></span></a>
      <p class="tagline">Stories, posts and print, made by you or your AI agent</p>
      <a class="create-cta" href="/">+ Create</a>
      <nav aria-label="Sections">
        <a class="nav" href="/designs"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1" /><rect width="7" height="7" x="14" y="3" rx="1" /><rect width="7" height="7" x="14" y="14" rx="1" /><rect width="7" height="7" x="3" y="14" rx="1" /></svg><span>Designs</span></a>
        <a class="nav" href="/resources"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.3 10a.7.7 0 0 1-.626-1.079L11.4 3a.7.7 0 0 1 1.198-.043L16.3 8.9a.7.7 0 0 1-.572 1.1Z" /><rect x="3" y="14" width="7" height="7" rx="1" /><circle cx="17.5" cy="17.5" r="3.5" /></svg><span>Resources</span></a>
        <a class="nav active" href="/settings" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" /><circle cx="12" cy="12" r="3" /></svg><span>Settings</span></a>
      </nav>
      <section class="recents" aria-label="Recent sessions">
        <h2>Recents</h2>
        <div id="recents"><p class="recents-empty">No sessions yet</p></div>
      </section>
      <div class="side-foot">
        <a class="nav" href="/getting-started"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" /><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09" /><path d="M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z" /><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05" /></svg><span>Getting started</span></a>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="titles">
          <h1>Settings</h1>
          <p class="count">Connect Blum Studio to the AI agents on this PC</p>
        </div>
        <div class="toolbar">
          <button id="refresh" class="ghost" type="button">Refresh</button>
        </div>
      </header>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <section class="agents" id="agents" aria-label="AI agents" tabindex="-1">
      </section>
    </main>
  </div>
  <script type="module" src="/js/gallery/settings.js"></script>

</html>
